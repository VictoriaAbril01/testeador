[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testlab-backend"
version = "0.1.0"
description = "TestLab persistence and API package"
requires-python = ">=3.13,<3.15"
dependencies = [
  "SQLAlchemy>=2.0.45,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cryptography>=44,<52",
  "pydantic-settings>=2.8,<3",
  "redis>=5,<8",
  "rq>=2,<3",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
blackbox = ["playwright>=1.58,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
